[project]
name = "tracesim"
version = "0.1.0"
description = "A trace-driven simulator that predicts the runtime of tensor workloads on a described device, and a study of when those predictions can be trusted."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "torch>=2.2",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tracesim = "tracesim.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tracesim"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# CPU-only PyTorch: the study measures a CPU and needs no GPU build.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
